<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Sandbox Portal</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="page-header">
    <div>
      <p class="eyebrow">Kubernetes operator view</p>
      <h1>Agent Sandbox Portal</h1>
    </div>
    <p id="inventory-summary">Loading Sandbox inventory…</p>
  </header>

  <main>
    <section class="filters" aria-label="Sandbox filters">
      <label for="filter-user">User</label>
      <input id="filter-user" name="user" type="search" placeholder="All users">
      <label for="filter-agent">Agent</label>
      <input id="filter-agent" name="agent" type="search" placeholder="All agents">
      <label for="filter-status">Status</label>
      <select id="filter-status" name="status">
        <option value="">All statuses</option>
        <option value="True">Ready</option>
        <option value="False">Not ready</option>
        <option value="Unknown">Unknown</option>
      </select>
    </section>

    <section aria-labelledby="sandbox-table-heading">
      <h2 id="sandbox-table-heading">Sandboxes</h2>
      <div class="table-frame">
        <table>
          <thead>
            <tr>
              <th scope="col">Namespace</th>
              <th scope="col">Sandbox</th>
              <th scope="col">Owner</th>
              <th scope="col">Status</th>
              <th scope="col">Runtime</th>
              <th scope="col">Connections</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="sandbox-rows"></tbody>
        </table>
      </div>
      <p id="inventory-status" class="status" aria-live="polite">Loading…</p>
    </section>
  </main>

  <aside id="terminal-drawer" class="terminal-drawer" aria-labelledby="terminal-heading" hidden>
    <header>
      <h2 id="terminal-heading">Terminal</h2>
      <button type="button" aria-label="Close terminal">Close</button>
    </header>
    <div id="terminal"></div>
  </aside>
</body>
</html>
